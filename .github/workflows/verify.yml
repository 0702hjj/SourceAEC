name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sourceaec
          POSTGRES_PASSWORD: sourceaec-test
          POSTGRES_DB: sourceaec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sourceaec -d sourceaec_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIEWER_PG_DSN: postgres://sourceaec:sourceaec-test@localhost:5432/sourceaec_test?sslmode=disable
      VIEWER_TEST_PG_DSN: postgres://sourceaec:sourceaec-test@localhost:5432/sourceaec_test?sslmode=disable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: converter/package-lock.json
      - run: npm ci && npm test
        working-directory: converter
      - name: Prepare external geometry runtime and Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uv venv --managed-python --python 3.12 "$RUNNER_TEMP/geometry"
          uv pip install --python "$RUNNER_TEMP/geometry/bin/python" ifcopenshell==0.8.3.post2 numpy==2.2.6 ezdxf==1.4.3
          echo "SOURCEAEC_PYTHON=$RUNNER_TEMP/geometry/bin/python" >> "$GITHUB_ENV"
          echo "SOURCEAEC_TEST_GEOMETRY=1" >> "$GITHUB_ENV"
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: scripts/test_go_integration.sh
      - run: scripts/check_file_size.sh && scripts/check_public_snapshot.sh && scripts/check_go_business.sh
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: web
      - run: npm ci && npm test && npm run docs:build
        working-directory: docs

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sourceaec
          POSTGRES_PASSWORD: sourceaec-test
          POSTGRES_DB: sourceaec_notebook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sourceaec -d sourceaec_notebook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIEWER_TEST_PG_DSN: postgres://sourceaec:sourceaec-test@localhost:5432/sourceaec_notebook_test?sslmode=disable
      SOURCEAEC_NOTEBOOK_AS_BYTES: '2147483648'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Prepare optional external notebook SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgl1 libglu1-mesa
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uv venv --managed-python --python 3.12 "$RUNNER_TEMP/notebook"
          uv pip install --only-binary=:all: --python "$RUNNER_TEMP/notebook/bin/python" simplecadapi==2.2.0b1
          echo "SOURCEAEC_TEST_NOTEBOOK_PYTHON=$RUNNER_TEMP/notebook/bin/python" >> "$GITHUB_ENV"
      - run: scripts/test_notebook_integration.sh
